<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>3D Snake – Verre Trempé & Bloom</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0a0a12;font-family:sans-serif;}
  #ui{position:absolute;top:20px;left:20px;color:#e0e0e0;text-shadow:0 0 6px #fff;}
  #score{font-size:1.2rem;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:6px;margin-bottom:8px;}
  #gameOver{position:absolute;inset:0;background:rgba(0,0,0,0.8);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;display:none;}
  .btn{padding:10px 20px;background:#00e676;color:#fff;border:none;border-radius:6px;cursor:font; font-size:1rem;}
  .btn:hover{background:#00cc5f;}
</style>
</head>
<body>
<div id="ui">
  <div id="score">Score: 0</div>
</div>
<div id="gameOver">
  <h2>Game Over</h2>
  <button class="btn" id="restartBtn">Rejouer</button>
</div>

<!-- Importmap pour Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------- SCENE / CAMERA / RENDERER ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a11);
scene.fog = new THREE.Fog(0x0a0a11, 10, 50);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 4, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ---------- POST‑PROCESSING (bloom) ----------
const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.8, // strength
  0.4, // radius
  0.85 // threshold
);
composer.addPass(bloomPass);

// ---------- LIGHTS (style "verre trempé") ----------
const ambient = new THREE.AmbientLight(0x444466, 0.6);
scene.add(ambient);

// clé directionnelle (ciel)
const keyLight = new THREE.DirectionalLight(0xffe0a5, 1.2);
keyLight.position.set(5, 10, 7.5);
keyLight.castShadow = true;
scene.add(keyLight);

// lumière de remplissage
const fillLight = new THREE.DirectionalLight(0x89cff0, 0.5);
fillLight.position.set(-5, -5, -7.5);
scene.add(fillLight);

// lumière de contour (rim)
const rimLight = new THREE.DirectionalLight(0xff6b6b, 0.4);
rimLight.position.set(0, 6, -10);
scene.add(rimLight);

// ---------- MATERIALS "verre trempé" ----------
function glassMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color: color,
    metalness: 0.2,
    roughness: 0.05, // très peu de rugosité -> miroir
    transmission: 0.8, // permet un peu de traverser la lumière
    opacity: 0.9,
    transparent: true,
    side: THREE.DoubleSide,
    // reflet simple via envMap (on utilise une cube noire avec un peu de brillance)
    envMap: null // laissé à null pour l'instant; on peut later ajouter une cube map
  });
}

// ---------- SNAKE SEGMENTS (cubes en verre) ----------
const segmentSize = 1.0;
let direction = new THREE.Vector2(1, 0);
let nextDirection = new THREE.Vector2(1, 0);
const segments = [];

function createSegment(pos, color) {
  const geom = new THREE.BoxGeometry(segmentSize, segmentSize, segmentSize, 6, 6, 6);
  const mat = glassMaterial(color);
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(pos);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  segments.push(mesh);
}

// serpent initial (3 segments)
createSegment(new THREE.Vector2(0, 0), 0xffffff); // blanc cassé
createSegment(new THREE.Vector2(-segmentSize, 0), 0xffffff);
createSegment(new THREE.Vector2(-2 * segmentSize, 0), 0xffffff);

// ---------- NOURRITURE (sphère en verre coloré) ----------
const foodColor = 0xff5f5f; // rose fluo
let food = null;
function spawnFood() {
  if (food) { scene.remove(food); food.geometry.dispose(); food.material.dispose(); }
  const radius = segmentSize / 2 + Math.random() * 0.3;
  const angle = Math.random() * Math.PI * 2;
  const dist = segmentSize * 4 + Math.random() * 5;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  const y = 0.55;
  const geom = new THREE.SphereGeometry(radius, 48, 48);
  const mat = new THREE.MeshStandardMaterial({
    color: foodColor,
    emissive: foodColor,
    emissiveIntensity: 1.5,
    transparent: true,
    opacity: 0.8,
    metalness: 0,
    roughness: 0.2,
  });
  food = new THREE.Mesh(geom, mat);
  food.position.set(x, y, z);
  food.castShadow = true;
  scene.add(food);
}
spawnFood();

// ---------- SCORE ----------
let score = 0;
document.getElementById('score').innerText = `Score: ${score}`;

// ---------- INPUT ----------
window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':   if (direction.y !== 1) nextDirection.set(0, -1); break;
    case 'ArrowDown': if (direction.y !== -1) nextDirection.set(0, 1); break;
    case 'ArrowLeft': if (direction.x !== 1) nextDirection.set(-1, 0); break;
    case 'ArrowRight':if (direction.x !== -1) nextDirection.set(1, 0); break;
  }
});

// ---------- PARTICULES à chaque mangement ----------
const particlesGeometry = new THREE.BufferGeometry();
const particleCount = 30;
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = 0;
  positions[i * 3 + 1] = 0;
  positions[i * 3 + 2] = 0;
  // couleur rose pâle
  colors[i * 3] = 1;
  colors[i * 3 + 1] = 0.3;
  colors[i * 3 + 2] = 0.6;
  sizes[i] = Math.random() * 0.2 + 0.1;
}
particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const particleMaterial = new THREE.PointsMaterial({
  size: 0.15,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  sizeAttenuation: true,
});
const particleSystem = new THREE.Points(particlesGeometry, particleMaterial);
particleSystem.visible = false;
scene.add(particleSystem);

// ---------- FONCTION de lancement de particules ----------
function explodeParticles(position) {
  particleSystem.position.copy(position);
  // réinitialiser positions dans l'espace local
  for (let i = 0; i < particleCount; i++) {
    const offset = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2
    ).multiplyScalar(0.5);
    // on ne stocke pas directement, on va juste faire tourner le système
  }
  particleSystem.visible = true;
  // disparition progressive
  const start = performance.now();
  function fade() {
    const elapsed = performance.now() - start;
    const progress = Math.min(elapsed / 500, 1);
    particleSystem.scale.set(1 - progress, 1 - progress, 1 - progress);
    particleSystem.opacity = 1 - progress;
    if (progress < 1) requestAnimationFrame(fade);
    else {
      particleSystem.visible = false;
      particleSystem.scale.set(1, 1, 1);
      particleSystem.opacity = 1;
    }
  }
  requestAnimationFrame(fade);
}

// ---------- BOUCLE DE JEU ----------
const speed = 0.08; // plus lent pour fluidité
let timer = 0;

function animate() {
  requestAnimationFrame(animate);
  timer += speed;
  if (timer > 1) {
    timer = 0;
    direction.copy(nextDirection);

    // nouvelle position de la tête
    const head = segments[0];
    const newPos = new THREE.Vector3();
    newPos.x = head.position.x + direction.x * segmentSize;
    newPos.y = head.position.y;
    newPos.z = head.position.z + direction.y * segmentSize;

    // auto-collision
    for (let i = 1; i < segments.length; i++) {
      if (newPos.distanceTo(segments[i].position) < segmentSize) {
        document.getElementById('gameOver').style.display = 'flex';
        return;
      }
    }

    // manger ?
    if (food && newPos.distanceTo(food.position) < segmentSize) {
      score++;
      document.getElementById('score').innerText = `Score: ${score}`;
      // croissance : ajouter un segment à la queue
      const tail = segments[segments.length - 1];
      const extra = new THREE.Mesh(
        new THREE.BoxGeometry(segmentSize, segmentSize, segmentSize, 6, 6, 6),
        glassMaterial(segments[segments.length - 1].material.color)
      );
      extra.position.copy(tail.position);
      extra.castShadow = true;
      scene.add(extra);
      segments.push(extra);
      // explosion de particules
      explodeParticles(food.position);
      spawnFood();
    }

    // déplacement du corps (chaque segment suit le précédent)
    for (let i = segments.length - 1; i > 0; i--) {
      segments[i].position.copy(segments[i - 1].position);
    }
    // tête
    head.position.copy(newPos);

    // wrap around arena (optionnel)
    const limit = 22;
    if (head.position.x > limit) head.position.x = -limit;
    if (head.position.x < -limit) head.position.x = limit;
    if (head.position.z > limit) head.position.z = -limit;
    if (head.position.z < -limit) head.position.z = limit;
  }

  // rotation lente de la caméra pour effet cinématique
  camera.position.x = Math.sin(performance.now() * 0.0003) * 3;
  camera.position.z = Math.cos(performance.now() * 0.0003) * 3;
  camera.lookAt(0, 0, 0);

  // rendu via composer (bloom)
  composer.render();
}
animate();

// ---------- REDIMENSION ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  composer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- RESTART ----------
document.getElementById('restartBtn').addEventListener('click', () => {
  // supprimer segments supplémentaires
  segments.forEach((s, idx) => {
    if (idx >= 3) {
      scene.remove(s);
      s.geometry.dispose();
      s.material.dispose();
    }
  });
  segments.length = 3;
  score = 0;
  document.getElementById('score').innerText = `Score: ${score}`;
  document.getElementById('gameOver').style.display = 'none';

  // reposition initiale
  segments[0].position.set(0, 0, 0);
  segments[1].position.set(-segmentSize, 0, 0);
  segments[2].position.set(-2 * segmentSize, 0, 0);
  direction.set(1, 0);
  nextDirection.set(1, 0);

  // retirer ancienne nourriture
  if (food) {
    scene.remove(food);
    food.geometry.dispose();
    food.material.dispose();
  }
  spawnFood();

  // masquer particules
  particleSystem.visible = false;
});
</script>
</body>
</html>
