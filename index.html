<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Snake - Ultra Modern</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', Tahoma, sans-serif; }
    #ui { position: absolute; top: 20px; left: 20px; color: #fff; text-shadow: 0 0 5px rgba(0,0,0,.8); }
    #score { font-size: 1.2rem; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 4px; backdrop-filter: blur(5px); }
    #gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: #fff; display: none; align-items: center; justify-content: center; font-size: 2rem; text-align: center; }
    .btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: #ff6b8a; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">Score: 0</div>
  </div>
  <div id="gameOver">Game Over<br><button class="btn" id="restartBtn">Restart</button></div>

  <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

// Camera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 12);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Controls (orbit for debug, you can remove if you want strict keyboard control)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lights
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffe0b2, 0.6);
dirLight.position.set(5, 10, 7.5);
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xbae6fd, 0.4);
fillLight.position.set(-5, -5, -7.5);
scene.add(fillLight);

// Neon glow material helper
const neonMaterial = (color) => new THREE.MeshStandardMaterial({
  color,
  emissive: color,
  emissiveIntensity: 0.5,
  metalness: 0.2,
  roughness: 0.6,
});

// Snake geometry
const segmentSize = 0.8;
let direction = new THREE.Vector2(1, 0);
let nextDirection = new THREE.Vector2(1, 0);
const segments = [];

function createSegment(pos, color) {
  const geom = new THREE.BoxGeometry(segmentSize, segmentSize, segmentSize);
  const mat = neonMaterial(color);
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(pos.x, pos.y, pos.z);
  scene.add(mesh);
  segments.push(mesh);
}

// Initial snake (3 segments)
createSegment(new THREE.Vector2(0, 0), 0x1dd1a1);
createSegment(new THREE.Vector2(-segmentSize, 0), 0x1dd1a1);
createSegment(new THREE.Vector2(-2*segmentSize, 0), 0x1dd1a1);

const foodColor = 0xff6b6b;
let food = null;
function spawnFood() {
  if (food) scene.remove(food);
  const radius = segmentSize/2 + Math.random()*0.5;
  const angle = Math.random()*Math.PI*2;
  const distance = segmentSize*3 + Math.random()*5;
  const x = Math.cos(angle)*distance;
  const z = Math.sin(angle)*distance;
  const y = 0.5;
  const foodGeom = new THREE.SphereGeometry(radius, 32, 32);
  const foodMat = new THREE.MeshStandardMaterial({ color: foodColor, emissive: foodColor, emissiveIntensity: 0.7 });
  food = new THREE.Mesh(foodGeom, foodMat);
  food.position.set(x, y, z);
  scene.add(food);
}
spawnFood();

let score = 0;
document.getElementById('score').innerText = `Score: ${score}`;

// Input
window.addEventListener('keydown', (e) => {
  switch(e.key) {
    case 'ArrowUp': if (direction.y !== 1) nextDirection.set(0, -1); break;
    case 'ArrowDown': if (direction.y !== -1) nextDirection.set(0, 1); break;
    case 'ArrowLeft': if (direction.x !== 1) nextDirection.set(-1, 0); break;
    case 'ArrowRight': if (direction.x !== -1) nextDirection.set(1, 0); break;
  }
});

// Game loop
const speed = 0.15;
let timer = 0;
function animate() {
  requestAnimationFrame(animate);
  timer += speed;
  if (timer > 1) {
    timer = 0;
    direction.copy(nextDirection);

    // Compute new head position
    const head = segments[0];
    const newPos = new THREE.Vector3();
    newPos.x = head.position.x + direction.x * segmentSize;
    newPos.y = head.position.y;
    newPos.z = head.position.z + direction.y * segmentSize;

    // Collision with self
    for (let i = 1; i < segments.length; i++) {
      if (newPos.distanceTo(segments[i].position) < segmentSize) {
        // Game over
        document.getElementById('gameOver').style.display = 'flex';
        return;
      }
    }

    // Check food collection
    if (food && newPos.distanceTo(food.position) < segmentSize) {
      score++;
      document.getElementById('score').innerText = `Score: ${score}`;
      // Add a new segment at the tail (duplicate last segment position)
      const tail = segments[segments.length - 1];
      const extra = new THREE.Mesh(
        new THREE.BoxGeometry(segmentSize, segmentSize, segmentSize),
        neonMaterial(segments[segments.length-1].material.color)
      );
      extra.position.copy(tail.position);
      scene.add(extra);
      segments.push(extra);
      spawnFood();
    }

    // Move segments: each follows the previous one
    for (let i = segments.length - 1; i > 0; i--) {
      segments[i].position.copy(segments[i-1].position);
    }
    // Move head
    head.position.copy(newPos);

    // Optional: wrap around edges
    if (head.position.x > 20) head.position.x = -20;
    if (head.position.x < -20) head.position.x = 20;
    if (head.position.z > 20) head.position.z = -20;
    if (head.position.z < -20) head.position.z = 20;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// Restart
document.getElementById('restartBtn').addEventListener('click', () => {
  // Remove all segments except first 3
  segments.forEach((s, idx) => {
    if (idx >= 3) scene.remove(s);
  });
  segments.length = 3;
  score = 0;
  document.getElementById('score').innerText = `Score: ${score}`;
  document.getElementById('gameOver').style.display = 'none';
  // reposition initial segments
  segments[0].position.set(0, 0, 0);
  segments[1].position.set(-segmentSize, 0, 0);
  segments[2].position.set(-2*segmentSize, 0, 0);
  direction.set(1, 0);
  nextDirection.set(1, 0);
  // remove old food and spawn new
  if (food) scene.remove(food);
  spawnFood();
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
